<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<!-- 외부 통신과 폼 전송을 브라우저 차원에서 차단한다. 입력값이 주소창이나 서버로 나갈 길이 없다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>차량 매입 송금 의뢰</title>
<style>
  :root {
    --green: #136f45;
    --green-dark: #0d5534;
    --green-soft: #e4f1ea;
    --bg: #f2f4f1;
    --card: #fff;
    --line: #d5dad4;
    --text: #16201a;
    --muted: #5f6a63;
    --err: #b3261e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  section, .footer { padding: 24px 20px; }
  section { border-bottom: 1px solid var(--line); }
  section h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 17px; }
  .num {
    display: grid; place-items: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--green-soft); color: var(--green); font-size: 12px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { min-width: 0; margin: 0 0 14px; padding: 0; border: 0; }
  .field:last-child, .row > .field { margin-bottom: 0; }
  .row + .field, .field + .row, .row + .row, .row + .total { margin-top: 14px; }
  label, legend { display: block; margin-bottom: 6px; padding: 0; font-size: 13px; font-weight: 700; }
  input:not([type=radio]) {
    width: 100%; height: 44px; padding: 0 12px;
    border: 1px solid #aab1ab; border-radius: 8px;
    background: #fff; color: inherit; font: inherit; font-size: 16px;
  }
  input::placeholder { color: #8b948d; }
  input:focus-visible, button:focus-visible, pre:focus-visible, .radios label:focus-within {
    outline: 2px solid var(--green); outline-offset: 2px;
  }
  input[aria-invalid=true] { border-color: var(--err); }
  .err { min-height: 0; margin: 4px 0 0; color: var(--err); font-size: 12px; }
  .err:empty { display: none; }
  .radios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .radios label {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; margin: 0; padding: 0 8px;
    border: 1px solid #aab1ab; border-radius: 8px;
    font-weight: 500; cursor: pointer;
  }
  .radios label:has(:checked) { border-color: var(--green); background: var(--green-soft); font-weight: 700; }
  .radios input { accent-color: var(--green); margin: 0; }
  .money { position: relative; }
  .money input { padding-right: 34px; text-align: right; }
  .money span { position: absolute; right: 12px; top: 11px; color: var(--muted); pointer-events: none; }
  .total {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border-radius: 10px;
    background: var(--green-soft); color: var(--green-dark); font-weight: 700;
  }
  .total output { font-size: 26px; color: var(--text); }
  .total small { font-size: 13px; color: var(--text); }
  .account + .account { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .acct-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  /* 계좌가 1개뿐이면 번호·삭제·계좌별 금액은 필요 없다 */
  .account:only-child .acct-head, .account:only-child .acct-amount { display: none; }
  .account:only-child .acct-row { grid-template-columns: 1fr; }
  .remove { height: 40px; padding: 0 14px; font-size: 13px; }
  #addAccount { width: 100%; margin-top: 14px; border-style: dashed; background: #fff; color: var(--green); }
  .notice { margin: 0 0 14px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .notice b { color: var(--err); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    height: 46px; padding: 0 18px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #f6f7f5; color: var(--text); font: inherit; font-weight: 700; cursor: pointer;
  }
  button.primary { flex: 1; border-color: var(--green); background: var(--green); color: #fff; }
  button.primary:hover { background: var(--green-dark); }
  dialog {
    width: min(480px, calc(100vw - 32px)); padding: 20px;
    border: 1px solid var(--line); border-radius: 16px; color: var(--text);
  }
  dialog::backdrop { background: rgb(0 0 0 / 0.45); }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  pre {
    margin: 0 0 12px; padding: 14px; max-height: 50vh; overflow: auto;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    font: inherit; font-size: 14px; white-space: pre-wrap; word-break: break-all;
  }
  #status { margin: 0 0 12px; color: var(--green-dark); font-size: 13px; font-weight: 700; }
  #status:empty { margin: 0; }
  @media (max-width: 520px) {
    h1 { font-size: 23px; }
    .row { grid-template-columns: 1fr; }
    .radios { grid-template-columns: repeat(2, 1fr); }
    section, .footer { padding: 20px 16px; }
  }
</style>
</head>
<body>
<main>
  <h1>차량 매입 송금 의뢰</h1>
  <p class="lead">필수 정보를 입력하고 카카오톡으로 보낼 문구를 완성하세요. 입력 내용은 어디에도 저장되지 않습니다.</p>

  <form id="form" method="dialog" novalidate autocomplete="off">
    <section>
      <h2><span class="num">1</span>신청인 정보</h2>
      <div class="field">
        <label for="applicant">신청인</label>
        <input id="applicant" name="applicant" placeholder="성명 또는 상호" maxlength="40" aria-describedby="err-applicant">
        <p class="err" id="err-applicant"></p>
      </div>
      <fieldset class="field" id="businessType" aria-describedby="err-businessType">
        <legend>사업자 유형</legend>
        <div class="radios">
          <label><input type="radio" name="businessType" value="사업자 없음">사업자 없음</label>
          <label><input type="radio" name="businessType" value="법인사업자">법인사업자</label>
          <label><input type="radio" name="businessType" value="개인사업자">개인사업자</label>
          <label><input type="radio" name="businessType" value="면세사업자">면세사업자</label>
          <label><input type="radio" name="businessType" value="간이사업자">간이사업자</label>
          <label><input type="radio" name="businessType" value="비영리법인">비영리법인</label>
        </div>
        <p class="err" id="err-businessType"></p>
      </fieldset>
    </section>

    <section>
      <h2><span class="num">2</span>차량·소유자 정보</h2>
      <div class="row">
        <div class="field">
          <label for="vehicleName">차량명</label>
          <input id="vehicleName" name="vehicleName" placeholder="제조사·모델명" maxlength="40" aria-describedby="err-vehicleName">
          <p class="err" id="err-vehicleName"></p>
        </div>
        <div class="field">
          <label for="vehicleNumber">차량번호</label>
          <input id="vehicleNumber" name="vehicleNumber" placeholder="예: 12가3456" maxlength="12" aria-describedby="err-vehicleNumber">
          <p class="err" id="err-vehicleNumber"></p>
        </div>
      </div>
      <div class="field">
        <label for="ownerName">차량 소유자(차주 성명)</label>
        <input id="ownerName" name="ownerName" placeholder="차주 성명" maxlength="40" aria-describedby="err-ownerName">
        <p class="err" id="err-ownerName"></p>
      </div>
    </section>

    <section>
      <h2><span class="num">3</span>송금액</h2>
      <div class="row">
        <div class="field">
          <label for="ownerPayment">차주 지급액</label>
          <div class="money"><input id="ownerPayment" name="ownerPayment" inputmode="numeric" placeholder="0" data-money aria-describedby="err-ownerPayment"><span>원</span></div>
          <p class="err" id="err-ownerPayment"></p>
        </div>
        <div class="field">
          <label for="fee">수수료</label>
          <div class="money"><input id="fee" name="fee" inputmode="numeric" placeholder="0" data-money><span>원</span></div>
        </div>
      </div>
      <div class="total">
        <span>합계</span>
        <span><output id="total" for="ownerPayment fee">0</output> <small>원</small></span>
      </div>
    </section>

    <section>
      <h2><span class="num">4</span>입금 계좌</h2>
      <div id="accounts"></div>
      <button type="button" id="addAccount">+ 계좌 추가 (최대 5개)</button>
      <!-- 계좌 한 묶음. id·label 연결은 renumberAccounts()가 순서대로 붙인다. -->
      <template id="account-tpl">
        <div class="account" role="group">
          <div class="acct-head">
            <strong class="acct-title"></strong>
            <button type="button" class="remove">삭제</button>
          </div>
          <div class="row">
            <div class="field">
              <label>예금주</label>
              <input name="accountHolder" placeholder="예금주명" maxlength="40">
              <p class="err"></p>
            </div>
            <div class="field">
              <label>은행명</label>
              <input name="bankName" list="banks" placeholder="예: 국민은행" maxlength="20">
              <p class="err"></p>
            </div>
          </div>
          <div class="row acct-row">
            <div class="field">
              <label>계좌번호</label>
              <input name="accountNumber" inputmode="numeric" placeholder="숫자만 입력" maxlength="24">
              <p class="err"></p>
            </div>
            <div class="field acct-amount">
              <label>이 계좌 송금액 (선택)</label>
              <div class="money"><input name="accountAmount" inputmode="numeric" placeholder="0" data-money><span>원</span></div>
            </div>
          </div>
        </div>
      </template>
      <datalist id="banks">
        <option value="국민은행"><option value="신한은행"><option value="우리은행"><option value="하나은행">
        <option value="농협은행"><option value="기업은행"><option value="SC제일은행"><option value="카카오뱅크">
        <option value="토스뱅크"><option value="케이뱅크"><option value="새마을금고"><option value="우체국">
        <option value="수협은행"><option value="신협"><option value="부산은행"><option value="iM뱅크">
        <option value="경남은행"><option value="광주은행"><option value="전북은행"><option value="제주은행">
      </datalist>
    </section>

    <div class="footer">
      <p class="notice"><b>계좌번호</b>가 포함됩니다. 계좌가 여러 개면 계좌별 송금액을 적어 주세요. 완성된 문구는 담당자와의 1:1 대화방에만 보내주세요.</p>
      <div class="actions">
        <button type="submit" class="primary">전송 내용 확인</button>
        <button type="reset">입력 초기화</button>
      </div>
    </div>
  </form>
</main>

<dialog id="preview" aria-labelledby="preview-title">
  <h2 id="preview-title">전송 내용 확인</h2>
  <p class="hint">아래 문구가 카카오톡으로 전송됩니다. 내용을 확인한 뒤 담당자와의 1:1 대화방으로 보내세요.</p>
  <pre id="message" tabindex="0"></pre>
  <p id="status" role="status"></p>
  <div class="actions">
    <button type="button" id="share" class="primary">카카오톡으로 보내기</button>
    <button type="button" id="copy">문구 복사</button>
    <button type="button" id="close">수정하기</button>
  </div>
</dialog>

<script>
// ---- 순수 로직 (화면과 무관, selfCheck()로 점검) ----
const MAX_AMOUNT_DIGITS = 12; // 1조 미만. JS 정수 안전 범위 안.
const MAX_ACCOUNTS = 5;
const ACCOUNT_FIELDS = ['accountHolder', 'bankName', 'accountNumber', 'accountAmount'];

const REQUIRED = {
  applicant: '신청인을 입력하세요.',
  businessType: '사업자 유형을 선택하세요.',
  vehicleName: '차량명을 입력하세요.',
  vehicleNumber: '차량번호를 입력하세요.',
  ownerName: '차주 성명을 입력하세요.',
  ownerPayment: '차주 지급액을 입력하세요.',
};

// 소수점 이하는 버린다. 붙여넣은 "12,000,000.00"이 100배로 읽히면 안 된다.
const parseAmount = (value) => Number(String(value ?? '').split('.')[0].replace(/\D/g, '').slice(0, MAX_AMOUNT_DIGITS)) || 0;
const formatWon = (amount) => amount.toLocaleString('ko-KR');

function normalize(raw) {
  const text = (value) => String(value ?? '').trim();
  return {
    applicant: text(raw.applicant),
    businessType: text(raw.businessType),
    vehicleName: text(raw.vehicleName),
    vehicleNumber: text(raw.vehicleNumber).replace(/\s/g, ''),
    ownerName: text(raw.ownerName),
    ownerPayment: parseAmount(raw.ownerPayment),
    fee: parseAmount(raw.fee),
    accounts: (raw.accounts ?? [{}]).map((account) => ({
      accountHolder: text(account.accountHolder),
      bankName: text(account.bankName),
      accountNumber: text(account.accountNumber).replace(/[^\d-]/g, ''),
      amount: parseAmount(account.accountAmount),
    })),
  };
}

// 오류 키는 화면 요소의 id와 같다. 계좌 칸은 "이름-순번"(예: accountNumber-1).
function validate(data) {
  const missing = Object.entries(REQUIRED).filter(([key]) => !data[key]);
  const accountErrors = data.accounts.flatMap((account, i) => [
    !account.accountHolder && [`accountHolder-${i}`, '예금주를 입력하세요.'],
    !account.bankName && [`bankName-${i}`, '은행명을 입력하세요.'],
    !/\d/.test(account.accountNumber) && [`accountNumber-${i}`, '계좌번호를 입력하세요.'],
  ].filter(Boolean));
  return Object.fromEntries([...missing, ...accountErrors]);
}

function buildMessage(data, now) {
  const pad = (n) => String(n).padStart(2, '0');
  const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const multi = data.accounts.length > 1;
  const accountLines = data.accounts.flatMap((account, i) => [
    ...(multi ? [`[계좌 ${i + 1}]`] : []),
    `예금주: ${account.accountHolder}`,
    `은행명: ${account.bankName}`,
    `계좌번호: ${account.accountNumber}`,
    ...(multi && account.amount ? [`송금액: ${formatWon(account.amount)}원`] : []),
  ]);
  return [
    '[차량매입 송금의뢰]',
    `신청일시: ${stamp}`,
    `신청인: ${data.applicant}`,
    `사업자 유형: ${data.businessType}`,
    `차량명: ${data.vehicleName}`,
    `차량번호: ${data.vehicleNumber}`,
    `차주 성명: ${data.ownerName}`,
    `차주 지급액: ${formatWon(data.ownerPayment)}원`,
    `수수료: ${formatWon(data.fee)}원`,
    `합계: ${formatWon(data.ownerPayment + data.fee)}원`,
    ...accountLines,
  ].join('\n');
}

// 콘솔에서 selfCheck() 실행. 로직이 깨지면 예외를 던진다.
function selfCheck() {
  const eq = (actual, expected, label) => {
    if (actual !== expected) throw new Error(`selfCheck 실패 - ${label}: ${actual} !== ${expected}`);
  };
  eq(parseAmount('12,000,000'), 12000000, '쉼표 금액');
  eq(parseAmount(''), 0, '빈 금액');
  eq(parseAmount('-1.5원'), 1, '숫자 외 문자와 소수점 이하 제거');
  eq(parseAmount('12,000,000.00'), 12000000, '소수점 붙은 금액');
  eq(formatWon(12300000), '12,300,000', '천 단위 쉼표');
  eq(Object.keys(validate(normalize({}))).length, 9, '빈 폼은 필수 9개 오류');

  const data = normalize({
    applicant: ' 홍길동 ', businessType: '개인사업자', vehicleName: '현대 그랜저', vehicleNumber: '12가 3456',
    ownerName: '김차주', ownerPayment: '12,000,000', fee: '300,000',
    accounts: [{ accountHolder: '김차주', bankName: '국민은행', accountNumber: '123456-78-901234', accountAmount: '999' }],
  });
  const [firstAccount] = data.accounts;
  eq(Object.keys(validate(data)).length, 0, '정상 입력은 오류 없음');
  eq(data.vehicleNumber, '12가3456', '차량번호 공백 제거');
  eq(Object.keys(validate({ ...data, fee: 0 })).length, 0, '수수료 0원 허용');
  eq(validate({ ...data, accounts: [{ ...firstAccount, accountNumber: '-' }] })['accountNumber-0'], '계좌번호를 입력하세요.', '숫자 없는 계좌번호');

  const message = buildMessage(data, new Date(2026, 9, 2, 14, 5));
  eq(message.split('\n').length, 13, '계좌 1개 문구는 13줄');
  eq(message.includes('신청일시: 2026-10-02 14:05'), true, '신청일시');
  eq(message.includes('합계: 12,300,000원'), true, '합계');
  eq(message.includes('계좌번호: 123456-78-901234'), true, '계좌번호 전체');
  eq(message.includes('[계좌 1]') || message.includes('송금액'), false, '계좌 1개면 번호와 계좌별 금액 없음');

  const blankAccount = normalize({ accounts: [{}] }).accounts[0];
  eq(Object.keys(validate({ ...data, accounts: [firstAccount, blankAccount] })).join(), 'accountHolder-1,bankName-1,accountNumber-1', '빈 두 번째 계좌는 오류 3개');

  const secondAccount = { accountHolder: '박가족', bankName: '신한은행', accountNumber: '110-123-456789', amount: 5000000 };
  const multiMessage = buildMessage({ ...data, accounts: [{ ...firstAccount, amount: 0 }, secondAccount] }, new Date(2026, 9, 2, 14, 5));
  eq(multiMessage.split('\n').length, 19, '계좌 2개 문구는 19줄');
  eq(multiMessage.includes('[계좌 2]\n예금주: 박가족\n은행명: 신한은행\n계좌번호: 110-123-456789\n송금액: 5,000,000원'), true, '두 번째 계좌와 금액');
  eq(multiMessage.includes('송금액: 0원'), false, '금액 비운 계좌는 송금액 줄 없음');
  return 'selfCheck 통과';
}

// ---- 화면 ----
const form = document.getElementById('form');
const totalEl = document.getElementById('total');
const dialog = document.getElementById('preview');
const messageEl = document.getElementById('message');
const statusEl = document.getElementById('status');
const shareBtn = document.getElementById('share');
const copyBtn = document.getElementById('copy');

// PC 브라우저의 공유창에는 카카오톡이 없으므로 터치 기기에서만 공유 버튼을 쓴다.
const canShare = Boolean(navigator.share) && matchMedia('(pointer: coarse)').matches;
shareBtn.hidden = !canShare;
copyBtn.classList.toggle('primary', !canShare);
(canShare ? shareBtn : copyBtn).autofocus = true;

const accountsEl = document.getElementById('accounts');
const addAccountBtn = document.getElementById('addAccount');
const accountTpl = document.getElementById('account-tpl');

// 추가·삭제 뒤 계좌 번호와 id·label·오류문구 연결을 화면 순서대로 다시 붙인다.
function renumberAccounts() {
  [...accountsEl.children].forEach((accountEl, i) => {
    const titleEl = accountEl.querySelector('.acct-title');
    titleEl.textContent = `계좌 ${i + 1}`;
    titleEl.id = `acct-title-${i}`;
    accountEl.setAttribute('aria-labelledby', titleEl.id);
    accountEl.querySelector('.remove').setAttribute('aria-label', `계좌 ${i + 1} 삭제`);
    for (const input of accountEl.querySelectorAll('input')) {
      const field = input.closest('.field');
      const errEl = field.querySelector('.err');
      input.id = `${input.name}-${i}`;
      field.querySelector('label').htmlFor = input.id;
      if (errEl) {
        errEl.id = `err-${input.id}`;
        input.setAttribute('aria-describedby', errEl.id);
      }
    }
  });
  addAccountBtn.hidden = accountsEl.children.length >= MAX_ACCOUNTS;
}

function addAccount() {
  accountsEl.append(accountTpl.content.cloneNode(true));
  renumberAccounts();
}
addAccount();

addAccountBtn.addEventListener('click', () => {
  addAccount();
  accountsEl.lastElementChild.querySelector('input').focus();
});

accountsEl.addEventListener('click', (event) => {
  if (!event.target.matches('.remove')) return;
  const accountEl = event.target.closest('.account');
  const hasInput = [...accountEl.querySelectorAll('input')].some((input) => input.value);
  if (hasInput && !confirm('이 계좌에 입력한 내용을 지울까요?')) return;
  accountEl.remove();
  renumberAccounts();
  addAccountBtn.focus();
});

const currentData = () => normalize({
  ...Object.fromEntries(new FormData(form)),
  accounts: [...accountsEl.children].map((accountEl) =>
    Object.fromEntries(ACCOUNT_FIELDS.map((name) => [name, accountEl.querySelector(`[name=${name}]`).value]))),
});

function showErrors(errors) {
  for (const errEl of form.querySelectorAll('.err')) {
    const key = errEl.id.replace('err-', '');
    errEl.textContent = errors[key] ?? '';
    document.getElementById(key).setAttribute('aria-invalid', String(key in errors));
  }
}

function focusField(key) {
  const el = document.getElementById(key);
  (el.matches('input') ? el : el.querySelector('input')).focus();
}

form.addEventListener('input', (event) => {
  const el = event.target;
  if ('money' in el.dataset) el.value = /\d/.test(el.value) ? formatWon(parseAmount(el.value)) : '';
  if (el.name === 'accountNumber') el.value = el.value.replace(/[^\d-]/g, '');
  const key = el.type === 'radio' ? el.name : el.id;
  const errEl = document.getElementById(`err-${key}`);
  if (errEl) {
    errEl.textContent = '';
    document.getElementById(key).setAttribute('aria-invalid', 'false');
  }
  const data = currentData();
  totalEl.textContent = formatWon(data.ownerPayment + data.fee);
});

form.addEventListener('submit', (event) => {
  event.preventDefault();
  const data = currentData();
  const errors = validate(data);
  showErrors(errors);
  const [firstInvalid] = Object.keys(errors);
  if (firstInvalid) {
    focusField(firstInvalid);
    return;
  }
  messageEl.textContent = buildMessage(data, new Date());
  statusEl.textContent = '';
  dialog.showModal();
});

form.addEventListener('reset', (event) => {
  if (!confirm('입력한 내용을 모두 지울까요?')) {
    event.preventDefault();
    return;
  }
  accountsEl.replaceChildren(accountsEl.firstElementChild);
  renumberAccounts();
  showErrors({});
  totalEl.textContent = '0';
});

async function copyMessage() {
  try {
    await navigator.clipboard.writeText(messageEl.textContent);
    statusEl.textContent = '복사했습니다. 카카오톡 대화방에 붙여넣어 보내세요.';
  } catch {
    // 클립보드 권한이 없는 환경(https가 아닌 주소, 일부 인앱 브라우저): 문구를 선택해 직접 복사하게 한다.
    getSelection().selectAllChildren(messageEl);
    statusEl.textContent = document.execCommand('copy')
      ? '복사했습니다. 카카오톡 대화방에 붙여넣어 보내세요.'
      : '자동 복사가 막혀 있습니다. 선택된 문구를 직접 복사해 카카오톡에 붙여넣으세요.';
  }
}

shareBtn.addEventListener('click', async () => {
  shareBtn.disabled = true; // 공유창이 떠 있는 동안 두 번 눌리지 않게 한다
  try {
    await navigator.share({ text: messageEl.textContent });
    statusEl.textContent = '공유창에서 카카오톡 대화방을 골라 보냈다면 완료입니다.';
  } catch (error) {
    if (error.name !== 'AbortError') await copyMessage(); // 사용자가 공유창을 닫은 경우는 그대로 둔다
  } finally {
    shareBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', copyMessage);
document.getElementById('close').addEventListener('click', () => dialog.close());
</script>
</body>
</html>
